name: release

# Tag a commit (git tag v0.1.0 && git push origin v0.1.0) and every supported
# (lib, site) builds, tests, stages and uploads its tarball to the GitHub
# release.  workflow_dispatch with an existing tag rebuilds/re-uploads.
#
# The build matrices mirror ci.yml; ci/check-workflows.sh keeps them in sync
# with ci/site-matrix.env.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to rebuild and re-upload (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: linux-x86_64,       lib: openssl }
          - { site: linux-x86_64,       lib: jemalloc }
          - { site: linux-x86_64,       lib: liburing }
          - { site: linux-x86_64-clang, lib: openssl }
          - { site: linux-x86_64-clang, lib: jemalloc }
          - { site: linux-x86_64-clang, lib: liburing }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: liburing test deps (consistent libbpf + bpftool)
        if: matrix.lib == 'liburing'
        run: bash scripts/setup.sh --with-libbpf
      - name: build + upstream tests
        run: bash scripts/ci/build-test.sh ${{ matrix.lib }} ${{ matrix.site }}
      - name: stage dist tarball
        run: bash scripts/ci/stage-dist.sh ${{ matrix.lib }} ${{ matrix.site }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.lib }}-${{ matrix.site }}
          path: dist-out/*.tar.gz
          if-no-files-found: error

  linux-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: linux-aarch64, apt: gcc-aarch64-linux-gnu }
          - { site: linux-armv7,   apt: gcc-arm-linux-gnueabihf }
          - { site: linux-riscv64, apt: gcc-riscv64-linux-gnu }
          - { site: linux-ppc64le, apt: gcc-powerpc64le-linux-gnu }
          - { site: linux-s390x,   apt: gcc-s390x-linux-gnu }
          - { site: linux-i686,    apt: gcc-i686-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qemu-user ${{ matrix.apt }}
      - name: build + smoke for every supported lib
        run: |
          rc=0
          for lib in $(awk -F'|' -v s="${{ matrix.site }}" '$1 == s { print $8 }' ci/site-matrix.env); do
            bash scripts/ci/build-test.sh "$lib" "${{ matrix.site }}" || rc=1
          done
          exit $rc
      - name: stage dist tarballs
        run: |
          for lib in $(awk -F'|' -v s="${{ matrix.site }}" '$1 == s { print $8 }' ci/site-matrix.env); do
            bash scripts/ci/stage-dist.sh "$lib" "${{ matrix.site }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cross-${{ matrix.site }}
          path: dist-out/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: windows-msvc-x64,   lib: openssl }
          - { site: windows-msvc-x64,   lib: jemalloc }
          - { site: windows-msvc-x86,   lib: openssl }
          - { site: windows-msvc-x86,   lib: jemalloc }
          - { site: windows-msvc-arm64, lib: openssl }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: NASM (OpenSSL assembler)
        if: matrix.lib == 'openssl'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: build (loads Visual Studio via build.ps1)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 ${{ matrix.lib }} -Site ${{ matrix.site }}
      - name: stage dist tarball
        shell: bash
        run: bash scripts/ci/stage-dist.sh ${{ matrix.lib }} ${{ matrix.site }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.lib }}-${{ matrix.site }}
          path: dist-out/*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: macos-arm64, lib: openssl }
          - { site: macos-arm64, lib: jemalloc }
          - { site: macos-x64,   lib: openssl }
          - { site: macos-x64,   lib: jemalloc }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: build + upstream tests
        run: bash scripts/ci/build-test.sh ${{ matrix.lib }} ${{ matrix.site }}
      - name: stage dist tarball
        run: bash scripts/ci/stage-dist.sh ${{ matrix.lib }} ${{ matrix.site }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.lib }}-${{ matrix.site }}
          path: dist-out/*.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        site: [android-arm64-v8a, android-armeabi-v7a, android-x86_64, android-x86]
        lib: [openssl, jemalloc]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/cache@v4
        with:
          path: .cache/ndk
          key: ndk-r27c-linux
      - name: fetch pinned NDK
        run: bash scripts/setup-ndk.sh
      - name: build + smoke
        run: bash scripts/ci/build-test.sh ${{ matrix.lib }} ${{ matrix.site }}
      - name: stage dist tarball
        run: bash scripts/ci/stage-dist.sh ${{ matrix.lib }} ${{ matrix.site }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.lib }}-${{ matrix.site }}
          path: dist-out/*.tar.gz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: [linux-native, linux-cross, windows, macos, android]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          files=$(ls *.tar.gz 2>/dev/null || true)
          [ -n "$files" ] || { echo "no artifacts"; exit 1; }
          sha256sum *.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "bst $tag" --generate-notes
          gh release upload "$tag" artifacts/*.tar.gz artifacts/SHA256SUMS --clobber
